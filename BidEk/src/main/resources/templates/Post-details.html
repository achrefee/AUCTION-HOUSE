<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Details - BidEk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: white; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #16213e; }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            margin: 30px auto;
            max-width: 800px;
        }
        .btn-custom {
            background-color: #00b4d8;
            color: white;
            border-radius: 25px;
            border: none;
        }
        .btn-custom:hover { background-color: #0077b6; }
        .expired { opacity: 0.5; }
        h3, p, span, h5, strong { color: #ffffff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg px-4">
        <a class="navbar-brand" href="/home">BidEk</a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/create">Create Post</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown">Profile</a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="/my-posts">My Posts</a></li>
                        <li><a class="dropdown-item" href="/my-bids">My Bids</a></li>
                        <li><a class="dropdown-item" href="/account">My Account</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

<div class="container">
    <div class="card" id="detailsCard">
        <img id="postImage" class="img-fluid rounded mb-3" style="max-height: 300px; object-fit: cover; display: none;">
        <h3 id="title"></h3>
        <p id="description"></p>
        <p><strong>Starting Price:</strong> <span id="startPrice"></span> €</p>
        <p><strong>Highest Bid:</strong> <span id="highestBid"></span> € by <span id="highestBidder"></span></p>
        <p><strong>Deadline:</strong> <span id="countdown"></span></p>

        <!-- Expired message -->
        <div id="expiredMessage" class="alert alert-warning text-center" style="display:none;">
            This auction has expired. Bidding is closed.
        </div>

        <!-- Bids -->
        <div id="bidsContainer" class="mt-3"></div>

        <!-- Bid Form -->
        <div id="bidFormContainer" class="mt-4">
            <h5>Place a Bid</h5>
            <input type="number" min="0" step="0.01" class="form-control mb-2" id="bidAmount" placeholder="Enter bid amount">
            <button class="btn btn-custom" onclick="submitBid()">Submit Bid</button>
        </div>
    </div>
</div>

<script>
    const token = document.cookie.split('; ').find(row => row.startsWith('token='))?.split('=')[1];
    const postId = window.location.pathname.split("/").pop();
    let postDeadline;

    async function loadPost() {
        const res = await fetch(`/api/posts/${postId}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const post = await res.json();

        document.getElementById('title').innerText = post.title;
        document.getElementById('description').innerText = post.description;
        document.getElementById('startPrice').innerText = post.startingPrice;
        document.getElementById('highestBid').innerText = post.highestBid;
        document.getElementById('highestBidder').innerText = post.highestBidderEmail || 'N/A';

        if (post.imageUrl) {
            const img = document.getElementById('postImage');
            img.src = post.imageUrl;
            img.style.display = 'block';
        }

        postDeadline = new Date(post.deadline);
        updateCountdown();
        setInterval(updateCountdown, 1000);

        renderBids(post.bids);
    }

    function updateCountdown() {
        const now = new Date();
        const diff = postDeadline - now;
        const el = document.getElementById('countdown');

        if (diff <= 0) {
            el.innerText = 'Expired';
            document.getElementById('bidFormContainer').style.display = 'none';
            document.getElementById('expiredMessage').style.display = 'block';
            document.getElementById('detailsCard').classList.add('expired');
            return;
        }

        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        el.innerText = `${hours}h ${minutes}m ${seconds}s`;
    }

    function renderBids(bids) {
        const container = document.getElementById('bidsContainer');
        if (bids.length === 0) {
            container.innerHTML = '<p>No bids yet.</p>';
            return;
        }
        container.innerHTML = '<h5>Bids:</h5>';
        bids.slice().reverse().forEach(bid => {
            const p = document.createElement('p');
            p.textContent = `${bid.bidderEmail} - €${bid.amount} on ${new Date(bid.bidTime).toLocaleString()}`;
            container.appendChild(p);
        });
    }

    async function submitBid() {
        const amount = parseFloat(document.getElementById("bidAmount").value);
        const res = await fetch(`/api/posts/${postId}/bid`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ amount })
        });
        if (res.ok) {
            alert("Bid placed successfully!");
            loadPost();
        } else {
            alert("Failed to place bid.");
        }
    }

    loadPost();
</script>
</body>
</html>
