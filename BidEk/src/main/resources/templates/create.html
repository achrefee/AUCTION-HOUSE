<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create New Post - BidEk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #0f3460;
        }

        .navbar-brand {
            color: #00b4d8;
            font-weight: bold;
        }

        .navbar-nav .nav-link {
            color: white;
        }

        .navbar-nav .nav-link:hover {
            color: #00b4d8;
        }

        .container {
            margin-top: 60px;
            max-width: 600px;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-custom {
            background-color: #00b4d8;
            border: none;
        }

        .btn-custom:hover {
            background-color: #0077b6;
        }

        label {
            margin-top: 15px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home">BidEk</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/create">Create Post</a></li>
                <li><a class="dropdown-item" href="/account">My Account</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="text-center mb-4">Create a New Auction Post</h2>
    <form id="createPostForm">

        <label>Image</label>
        <input type="file" class="form-control" id="image" name="image" accept="image/*">

        <label>Title</label>
        <input type="text" class="form-control" name="title" required>

        <label>Description</label>
        <textarea class="form-control" name="description" rows="3" required></textarea>

        <label>Starting Price (€)</label>
        <input type="number" class="form-control" name="startingPrice" step="0.01" min="0" required>

        <label>Deadline</label>
        <input type="datetime-local" class="form-control" name="deadline" required>

        <button type="submit" class="btn btn-custom mt-4 w-100">Create Post</button>
    </form>
</div>

<script>
    document.getElementById('createPostForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const form = e.target;
        const formData = new FormData();

        formData.append("title", form.title.value);
        formData.append("description", form.description.value);
        formData.append("startingPrice", parseFloat(form.startingPrice.value));
        formData.append("deadline", form.deadline.value);
        formData.append("image", form.image.files[0]); // Ensure input has name="image"

        try {
            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + document.cookie.split('token=')[1]
                },
                body: formData
            });

            if (res.ok) {
                alert('Post created successfully!');
                window.location.href = '/home';
            } else {
                const err = await res.text();
                alert('Failed to create post: ' + err);
            }
        } catch (err) {
            alert('Network error');
        }
    });
</script>

</body>
</html>
