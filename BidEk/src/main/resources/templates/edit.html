<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Post - BidEk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1a1a2e;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      margin-top: 50px;
      max-width: 600px;
    }

    .form-control, .form-label {
      background: rgba(255,255,255,0.05);
      color: white;
      border: none;
    }

    .btn-custom {
      background-color: #00b4d8;
      color: white;
      border-radius: 25px;
      border: none;
    }

    .btn-custom:hover {
      background-color: #0077b6;
    }

    label {
      margin-top: 10px;
    }

    .form-control::placeholder {
      color: #ccc;
    }
  </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg px-4">
        <a class="navbar-brand" href="/home">BidEk</a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/create">Create Post</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown">Profile</a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="/my-posts">My Posts</a></li>
                        <li><a class="dropdown-item" href="/my-bids">My Bids</a></li>
                        <li><a class="dropdown-item" href="/account">My Account</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
<div class="container">
  <h2>Edit Post</h2>
  <form id="editForm" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" name="title" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="3" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Starting Price (€)</label>
      <input type="number" step="0.01" class="form-control" name="startingPrice" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Deadline</label>
      <input type="datetime-local" class="form-control" name="deadline" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Replace Image (optional)</label>
      <input type="file" class="form-control" name="image">
    </div>
    <button type="submit" class="btn btn-custom w-100">Update Post</button>
  </form>
</div>

<script>
  const token = document.cookie.split('; ').find(row => row.startsWith('token='))?.split('=')[1];
  const postId = new URLSearchParams(window.location.search).get('id');

  async function loadPost() {
    const res = await fetch(`/api/posts/${postId}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const post = await res.json();

    document.querySelector('[name="title"]').value = post.title;
    document.querySelector('[name="description"]').value = post.description;
    document.querySelector('[name="startingPrice"]').value = post.startingPrice;
    document.querySelector('[name="deadline"]').value = post.deadline.slice(0, 16); // for datetime-local
  }

  document.getElementById('editForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.target;
    const formData = {
      title: form.title.value,
      description: form.description.value,
      startingPrice: parseFloat(form.startingPrice.value),
      deadline: form.deadline.value
    };

    const res = await fetch(`/api/posts/${postId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify(formData)
    });

    if (res.ok) {
      alert('Post updated!');
      window.location.href = '/my-posts';
    } else {
      alert('Failed to update post.');
    }
  });

  loadPost();
</script>
</body>
</html>
